services:
  monica:
    build: .
    container_name: enigmademonica
    restart: unless-stopped
    ports:
      # Solo localhost (debug / fallback). Caddy habla por la red Docker.
      - "127.0.0.1:3847:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Persistencia admin + media (monica.json, fotos, premios, audio)
      - ./content:/app/content
      - ./public/assets:/app/public/assets
      - ./public/prizes:/app/public/prizes
      - ./public/audio:/app/public/audio
    networks:
      - default
      # Misma red que artizanale-caddy (como charad-frontend)
      - artizanale_default

networks:
  artizanale_default:
    external: true
